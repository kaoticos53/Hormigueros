name: CI

on:
  push:
    branches: [master]
  pull_request:

  # ───────────────────────────────────────────────────────────────────────────
  # DISPARADOR MANUAL (Actions → CI → «Run workflow»). Existe por el job
  # `unity-compile`, que está dormido en push: así se puede ejercitar UNA vez
  # —y en particular el paso del caché de descargas del editor— sin encender
  # `UNITY_CI` para todos los pushes.
  #
  # El input `unity` elige el ALCANCE:
  #
  #   none   (por defecto) → solo corre el job `test`, igual que un push.
  #   cache  → corre SOLO el paso del caché `actions/cache@v5` (más un mkdir
  #            del directorio que va a cachear) y SALTA el job `test`, que es
  #            el caro: segundos en total, sin licencia y sin descargar el
  #            editor. Es la prueba de que el paso del caché funciona en el
  #            runner. Usa una clave de SONDA (ver el paso).
  #   full   → el job COMPLETO: instala el CLI y ~5 GB de editor, activa
  #            licencia, compila en batch y devuelve la licencia. Necesita los
  #            secretos de licencia (ver el comentario del job); sin ellos falla
  #            en 2 s a propósito, antes de descargar nada.
  #
  # Los valores NO son `off`/`on`: en YAML 1.1 esos son booleanos y hay
  # parsers (no el de Actions, pero sí otros) que los convierten, con lo que la
  # opción dejaría de ser la cadena que compara el `if` del job. `none` no es
  # ambiguo en ningún dialecto.
  #
  # CÓMO SE LANZA:
  #   UI   → Actions → CI → «Run workflow» → elegir `unity` → Run workflow
  #   CLI  → gh workflow run ci.yml -f unity=cache
  #   API  → POST /repos/{owner}/{repo}/actions/workflows/ci.yml/dispatches
  #          con {"ref":"master","inputs":{"unity":"cache"}}
  workflow_dispatch:
    inputs:
      unity:
        description: 'Alcance del job de Unity: none (nada), cache (solo el caché) o full (compila)'
        type: choice
        options:
          - none
          - cache
          - full
        default: none

jobs:
  # El `test` es la suite headless y los seis pines: el trabajo caro del
  # workflow. No aporta nada cuando un dispatch solo quiere ejercitar el paso
  # del caché, así que en ese alcance se salta — y el ejercicio entero pasa de
  # ~7 min a ~15 s. En push, PR y en los otros dispatches corre como siempre.
  test:
    if: >-
      github.event_name != 'workflow_dispatch'
      || inputs.unity != 'cache'
    runs-on: ubuntu-latest
    steps:
      # checkout v5 y setup-dotnet v5 corren en Node 24: con v4 el runner avisa
      # en cada run de que Node 20 está deprecado y los fuerza a Node 24.
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Test (incluye el pin del hash del stream canónico)
        run: dotnet test --nologo -v q

      # ─────────────────────────────────────────────────────────────────────────
      # LOS PINS DE HASH DE ABAJO (5 scripts + la constante de la suite) SOLO SON
      # VÁLIDOS CON CANONMATH.
      #
      # Los hashes canónicos del mundo NO son independientes de la plataforma:
      # MathF.Tanh/Exp/Log/Sin/Cos difieren 1 ULP entre la libm de Windows y la
      # de Linux, y un ULP en un sensor cambia una decisión y diverge el mundo.
      # Todos los hashes fijados aquí (y el const de UnityStreamContractTests)
      # se generaron con Sim/CanonMath — series en double con solo ops IEEE
      # básicas — y SOLO reproducen con ella. No «arregles» un pin cambiando de
      # runner o de SDK: cambia la matemática, no el entorno.
      #
      # TRAS UN CAMBIO INTENCIONAL DEL MUNDO (constantes de especie, fundadora,
      # densidad de comida, activación del cerebro…), regenerar EN ORDEN:
      #   1. bash scripts/check-stream-fixture.sh --update   (canal A/B/C base)
      #   2. bash scripts/check-replay-command.sh --update   (pins 3000 y 6000
      #      ticks: replay-command.expected y replay-command-6k.expected)
      #   3. bash scripts/check-atta-command.sh --update     (F5.2a)
      #   4. bash scripts/check-invasion-command.sh --update (F5.2b)
      #   5. bash scripts/check-neat-command.sh --update     (F5.2c)
      #   6. El pin del fixture de stream vive EN LA SUITE:
      #      UnityStreamContractTests (const c143…). Lanza ese test, copia el
      #      hash REAL del fallo en la constante y re-ejecuta hasta verde.
      # Y SIEMPRE: revisa el diff de los .expected en el PR (los hashes viejos
      # documentan el mundo anterior), verifica que TODOS los pins pasan en
      # Windows Y Linux (WSL vale), y anota el cambio como intencional en el
      # commit — un pin que cambia «solo a veces» es un bug de determinismo,
      # no una regeneración.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Fixture hash check (regenera el stream canónico y compara)
        run: bash scripts/check-stream-fixture.sh

      - name: Replay hash check (partida con plan de drops del smoke e2e)
        run: bash scripts/check-replay-command.sh

      - name: Atta hash check (partida canónica de la cortadora — F5.2a)
        run: bash scripts/check-atta-command.sh

      - name: Invasion hash check (partida canónica del saqueo — F5.2b)
        run: bash scripts/check-invasion-command.sh

      - name: Neat hash check (invasión con pool v2 — cierre F5.2c)
        run: bash scripts/check-neat-command.sh

      # El analizador del barrido de costes (F5.3 §4.10) es la evidencia de
      # cuánto juego cabe y de dónde está el coste fijo, así que se verifica en
      # cada push y no solo a mano. NO necesita editor: `--selftest` sale ANTES
      # de tocar Unity (y de construir nada), así que es un paso de segundos que
      # no depende de `UNITY_CI` ni de licencia. Lo que comprueba, con las
      # cifras reales de la medición: la fila medida, la sublinealidad de los
      # núcleos por colonia, que un punto sin medir se declare, el intercepto
      # (1,507) y el marginal (0,1187) del ajuste, la predicción del punto menor
      # cuando se ajusta sin él (2,039) y que con un solo punto diga que no hay
      # ajuste en vez de inventar una recta.
      - name: Selftest del barrido de costes (ajuste fijo/marginal, sin editor)
        run: |
          # QUÉ awk HAY EN EL RUNNER. El barrido usa funciones de awk propias y
          # gawk y mawk no son la misma cosa, así que se publica cuál se usó — en
          # el log y como ANOTACIÓN (el log del job pide token; la anotación se
          # lee del run sin autenticarse, y así el dato no depende de un log).
          AWK_PATH="$(command -v awk)"
          AWK_IMPL="$(awk -W version 2>&1 | head -n 1)"
          echo "awk => $AWK_PATH — $AWK_IMPL"
          echo "::notice title=awk del runner::${AWK_PATH} — ${AWK_IMPL}"
          bash scripts/system-sweep.sh --selftest

      - name: Selftest del analizador de compilación de Unity (sin editor)
        run: bash scripts/check-unity-compile.sh --selftest

      - name: Selftest de las guardas del Unity CLI (sin editor)
        run: |
          bash scripts/lib/unity-project.sh --selftest
          bash scripts/lib/unity-cli.sh --selftest
          bash scripts/unity-cli.sh --selftest

      # El pre-push es una puerta de VERDAD (puede impedir un push), así que su
      # lógica de veredicto se verifica en cada push: solo el código 1 del gate
      # bloquea, y los «no pude comprobar» (2..5) avisan y dejan pasar. Sin
      # editor y sin Unity: es bash puro.
      - name: Selftest del hook pre-push (mapeo de códigos, sin editor)
        run: bash .githooks/pre-push --selftest

  # ───────────────────────────────────────────────────────────────────────────
  # Compilación del proyecto Unity. POR QUÉ no basta con `test`: la suite
  # headless solo compila los scripts PUROS que el csproj enlaza con
  # Link="UnityPure/…"; los MonoBehaviours (SimPresenterBehaviour,
  # HudLayoutBehaviour, SceneBootstrapper, …) NO se compilan ahí. Un `error CS`
  # en la capa de vista pasa `dotnet test` y solo revienta al abrir Unity — ya
  # pasó dos veces (`ColonyView?` con `!`, `CameraClearFlags.SolidCamera`).
  # Este job los compila en batch y falla con el primer error.
  #
  # DORMIDO por defecto (`UNITY_CI`): descargar Unity en cada push es caro y
  # necesita licencia. Se puede levantar de DOS maneras:
  #
  #   a) A MANO, en una sola pasada: Actions → CI → «Run workflow» con
  #      `unity: full` (o `gh workflow run ci.yml -f unity=full`); con
  #      `unity: cache` se ejercita SOLO el paso del caché, en segundos y sin
  #      licencia. El disparador manual NO sustituye a `UNITY_CI`: no hay
  #      puerta en cada push, solo cuando alguien lo pide.
  #   b) PERMANENTE: la variable `UNITY_CI = true` (más los secretos de abajo)
  #      y entonces el job corre en cada push y PR — siempre con alcance full.
  #
  # Además hay una tercera variable, `UNITY_RUNNER`, que decide DÓNDE corre el
  # job: sin ella es `ubuntu-latest` (el runner alojado, el único que puede
  # instalar y activar); con ella (p. ej. `self-hosted`) el job corre en esa
  # máquina ya licenciada y se salta toda la parte de instalación/licencia. Ver
  # el bloque de la licencia Personal más abajo para el porqué.
  #
  # La licencia (punto 2) la necesitan SOLO los runs de alcance `full`.
  # Hacen falta DOS cosas en Settings → Secrets and variables → Actions:
  #
  #   1. Variable  UNITY_CI = true   (solo para la vía b)
  #   2. UN secreto de licencia, según el tipo de licencia:
  #
  #      LEGACY PRO (serial) → UNITY_LICENSE_SERIAL
  #        XX-XXXX-XXXX-XXXX-XXXX-XXXX. `unity license activate --serial` la
  #        activa sin login, sin fichero y sin navegador: es la vía limpia en
  #        un runner efímero.
  #
  #      ENTERPRISE / INDUSTRY (asiento asignado) → UNITY_LICENSE_FILE_BASE64
  #        El .xml/.ulf que devuelve license.unity3d.com/manual a partir de un
  #        .alf generado en la máquina, en base64 y en UNA línea (`base64 -w0
  #        fichero`).
  #
  #      PERSONAL (gratuita) → NO HAY VÍA AUTOMÁTICA, y no es una limitación
  #        de este workflow ni del CLI: es de Unity. El manual de Unity 6.5 lo
  #        dice con todas las letras —«Manual activation … doesn't support …
  #        Unity Personal … To activate a license for Unity Personal, log in
  #        to the Unity Hub»— y el CLI solo sabe entrar sin navegador con
  #        cuentas de servicio, que el backend rechaza para activar (esta
  #        misma fase lo comprueba: `unity auth login` no expone usuario y
  #        contraseña, solo --client-id/--client-secret).
  #
  #        MEDIDO, no supuesto (run 35499256572, 2026-09-20): el fichero que
  #        el Hub deja en %LOCALAPPDATA%\Unity\licenses\ NO es un ULF sino el
  #        entitlement de la sesión, y `unity license activate --file` lo
  #        rechaza con «Cannot load ULF license: Signature element not found in
  #        XML document»: su <Signature> vive en el namespace XML-DSig
  #        (xmlns="http://www.w3.org/2000/09/xmldsig#") y el cargador ULF lo
  #        busca sin namespace. Subirlo en base64 es, por tanto, inútil.
  #
  #        2. ACTIVAR SIN FICHERO PIDE SESIÓN. `unity license activate
  #           --personal --accept-eula` (el flag EXISTE: medido con el binario
  #           1.0.0-beta.10 en un HOME aislado) responde «Sign in with unity
  #           auth login, or pass --serial»: en un runner efímero no hay sesión
  #           que valga, y `unity auth login` sin navegador solo acepta cuentas
  #           de servicio.
  #
  #        Y aunque el cargador ULF aceptara el fichero, el propio XML lleva
  #        cinco identificadores `Legacy.MachineBinding1..5` —el hash de la
  #        máquina y su MAC (b0:19:21:04:ed:fe)—: está atado a ESTA máquina,
  #        así que copiarlo a un runner no activaría nada ni aunque el formato
  #        fuera el bueno. Subirlo en base64 es, por tanto, doblemente inútil.
  #
  #        Las salidas que quedan, en orden de coste:
  #
  #          a) UN RUNNER SELF-HOSTED en la máquina que ya tiene el editor
  #             licenciado: se apunta el job con la VARIABLE de repositorio
  #             `UNITY_RUNNER` (p. ej. `self-hosted`) y el job SALTA la
  #             instalación del CLI y del editor, las librerías, la activación,
  #             el preflight y la devolución de licencia —la licencia es la del
  #             Hub de esa máquina— y compila con el editor que ya está
  #             instalado. Es la única vía que da una puerta PERMANENTE en CI
  #             sin pagar asiento. (Ese camino, hoy, está sin ejercitar: no hay
  #             runner registrado.)
  #          b) UN ASIENTO DE PAGO: serial legacy Pro (`UNITY_LICENSE_SERIAL`)
  #             o .ulf de un asiento Enterprise/Industry
  #             (`UNITY_LICENSE_FILE_BASE64`).
  #          c) LA PUERTA LOCAL, la única que cubre el riesgo HOY y sin
  #             infraestructura: `scripts/check-unity-compile.sh` usa el mismo
  #             editor licenciado de la máquina de desarrollo, es el MISMO
  #             script que corre este job y tarda SEGUNDOS con la Library
  #             caliente (8 s medidos el 2026-09-20). Para que no dependa de
  #             acordarse, `.githooks/pre-push` lo ejecuta antes de cada push y
  #             solo BLOQUEA con errores CS de verdad (exit 1): editor ausente,
  #             sin licencia o instancia que no llegó a compilar AVISAN y dejan
  #             pasar. Se instala con `scripts/install-hooks.sh`.
  #
  # OJO CON EL EQUILIBRIO: el 2026-09-20 se midió que los cinco pasos de
  # licencia y editor NO son portables a un runner que ya los tiene, así que
  # van condicionados a `UNITY_SELF_HOSTED`. Un verde de este job en modo
  # self-hosted significa «el proyecto compila con el editor de esa máquina»,
  # no «la instalación y la activación funcionan»: eso último solo lo prueba un
  # run alojado, y un run alojado con licencia Personal no existe (ver arriba).
  #
  # Los pasos de abajo salen del andamiaje oficial (`unity ci init --provider
  # github --dry-run`), no de la intuición: instalar el editor necesita
  # `--yes --accept-eula` (sin ellos se queda esperando una confirmación que en
  # CI nunca llega), el runner no trae las librerías de las que depende el
  # editor aunque sea batch, y la licencia hay que DEVOLVERLA al final para no
  # filtrar activaciones en runners efímeros.
  # ───────────────────────────────────────────────────────────────────────────
  unity-compile:
    # Las dos puertas: permanente por variable, o UNA vez por dispatch manual.
    # `inputs.unity` es un `choice`, así que llega como CADENA y la comparación
    # es la obvia; con un input `boolean` habría que comparar contra `true`
    # porque en `github.event.inputs` los booleanos son 'true'/'false' como
    # cadenas (donde `'false'` es verdadero si uno se descuida).
    if: >-
      vars.UNITY_CI == 'true'
      || (github.event_name == 'workflow_dispatch' && inputs.unity != 'none')
    # DÓNDE CORRE: por defecto el runner alojado (el único que puede instalar y
    # ACTIVAR el editor). Con la variable `UNITY_RUNNER` puesta, corre en esa
    # máquina — self-hosted, ya licenciada por el Hub — y los pasos que asumen
    # un runner virgen (CLI, editor, librerías, licencia, preflight) se saltan.
    runs-on: ${{ vars.UNITY_RUNNER || 'ubuntu-latest' }}
    env:
      # El CLI lo lee del entorno: sin esto, cualquier comando que quiera
      # preguntar algo se queda colgado hasta el timeout del job.
      UNITY_NON_INTERACTIVE: '1'
      # Anotaciones de GitHub en el resumen del run en vez de solo en el log.
      UNITY_FORMAT: github
      # ALCANCE: `full` compila el proyecto entero; `cache` corre solo el paso
      # del caché. En push y PR el input no existe y el alcance es full.
      UNITY_SCOPE: ${{ inputs.unity || 'full' }}
      # ¿EL RUNNER YA TIENE EDITOR Y LICENCIA? Se deriva de la MISMA variable que
      # elige `runs-on`, no de una detección en tiempo de ejecución: un runner
      # self-hosted que además instalara y activara repetiría trabajo y pediría
      # un secreto que su licencia hace innecesario.
      UNITY_SELF_HOSTED: ${{ vars.UNITY_RUNNER != '' }}
    steps:
      - uses: actions/checkout@v5

      # QUÉ VA A HACER ESTE RUN, escrito también en el resumen del run: el
      # mismo job tiene dos alcances y conviene no confundir un verde del paso
      # del caché con una compilación verificada.
      - name: Anunciar el alcance del job
        run: |
          if [[ "$UNITY_SCOPE" == "full" ]]; then
            echo "alcance: full — instala el editor, activa licencia y compila"
          else
            echo "alcance: cache — solo el paso del caché (ni licencia ni editor)"
          fi
          echo "runner: ${{ vars.UNITY_RUNNER || 'ubuntu-latest' }} (self-hosted: $UNITY_SELF_HOSTED)"
          echo "origen del evento: ${{ github.event_name }}"
          {
            echo "## Job de Unity — alcance $UNITY_SCOPE"
            echo
            echo "- origen del evento: ${{ github.event_name }}"
            echo "- variable UNITY_CI: '${{ vars.UNITY_CI }}'"
            echo "- runner: ${{ vars.UNITY_RUNNER || 'ubuntu-latest' }} (self-hosted: $UNITY_SELF_HOSTED)"
            echo
            if [[ "$UNITY_SCOPE" != "full" ]]; then
              echo "Este run NO compila el proyecto: solo ejercita el paso del caché."
            fi
            if [[ "$UNITY_SELF_HOSTED" == "true" ]]; then
              echo "Runner self-hosted: la instalación y la activación de Unity no"
              echo "corren (se usan el editor y la licencia que esa máquina ya tiene)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Antes de descargar ~5 GB de editor: ¿hay con qué activarlo? Un secreto
      # que falta debe costar 2 segundos, no 10 minutos. Solo en alcance full:
      # el modo `cache` no activa nada y no puede pedir licencia.
      - name: Comprobar los requisitos de activación
        # En self-hosted la licencia es la del Hub de esa máquina: pedir el
        # secreto aquí bloquearía un trabajo que NO lo necesita.
        if: env.UNITY_SCOPE == 'full' && env.UNITY_SELF_HOSTED != 'true'
        env:
          UNITY_LICENSE_SERIAL: ${{ secrets.UNITY_LICENSE_SERIAL }}
          UNITY_LICENSE_FILE_BASE64: ${{ secrets.UNITY_LICENSE_FILE_BASE64 }}
        run: |
          if [[ -n "${UNITY_LICENSE_SERIAL:-}" ]]; then
            echo "licencia: serial (Pro/Plus)"; exit 0
          fi
          if [[ -n "${UNITY_LICENSE_FILE_BASE64:-}" ]]; then
            echo "licencia: archivo offline (Personal)"; exit 0
          fi
          {
            echo "## Falta la licencia de Unity"
            echo
            echo "El job necesita UNO de estos dos secretos (ver el comentario del"
            echo "job para el detalle de cómo generarlos):"
            echo
            echo "- \`UNITY_LICENSE_SERIAL\` — serial legacy Pro (XX-XXXX-…): la"
            echo "  vía que funciona en un runner efímero sin más"
            echo "- \`UNITY_LICENSE_FILE_BASE64\` — .xml/.ulf de un asiento"
            echo "  Enterprise/Industry, de license.unity3d.com/manual"
            echo
            echo "Una licencia **Personal no se puede activar aquí**: Unity no"
            echo "admite su activación manual y el CLI solo entra sin navegador"
            echo "con cuentas de servicio, que el backend rechaza para activar."
            echo "Con Personal hay que usar un runner self-hosted con el editor"
            echo "ya licenciado (ver el comentario del job)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::define UNITY_LICENSE_FILE_BASE64 o UNITY_LICENSE_SERIAL en Settings → Secrets and variables → Actions"
          exit 1

      - name: Instalar el Unity CLI
        if: env.UNITY_SCOPE == 'full' && env.UNITY_SELF_HOSTED != 'true'
        run: |
          curl -fsSL https://public-cdn.cloud.unity3d.com/hub/prod/cli/install.sh \
            | UNITY_CLI_CHANNEL=beta bash
          # El instalador deja el binario en un directorio de usuario, fuera del
          # PATH de esta shell: se publica para los pasos siguientes.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # LA VERSIÓN DEL PROYECTO, LEÍDA UNA VEZ. La clave de la caché de
      # descargas cuelga de ella: el instalador guarda los archivos POR VERSIÓN,
      # así que una clave escrita a mano (`unity-downloads-6000.6.0f1`) queda
      # obsoleta en silencio el día que el proyecto suba de versión — el job
      # restauraría «con éxito» la caché de la versión anterior y se comería la
      # descarga entera sin que nadie se entere. Derivada del fichero que FIJA
      # la versión, no puede desincronizarse: si el proyecto sube, la clave
      # cambia sola.
      #
      # Corre en los DOS alcances (los dos usan la clave) y va ANTES de instalar
      # el CLI a propósito: no depende de que `unity` exista, solo de leer un
      # fichero del repo — el checkout ya pasó.
      - name: Leer la versión de Unity del proyecto
        id: unity-version
        run: |
          P="src/App/AntSim.Unity/ProjectSettings/ProjectVersion.txt"
          VERSION="$(sed -n 's/^m_EditorVersion: *//p' "$P" | tr -d '\r')"
          if [[ -z "$VERSION" ]]; then
            echo "::error::ProjectVersion.txt no tiene m_EditorVersion"
            exit 1
          fi
          # EL CHANGESET, y por qué hace falta (medido, no supuesto):
          # `unity install <versión>` NO resuelve contra el histórico de Unity
          # sino contra un CATÁLOGO CURADO de una sola versión por línea —
          # `unity editors --releases` en Linux devuelve exactamente cuatro
          # (6000.0.84f1, 6000.3.24f1, 6000.6.2f1, 6000.7.0b1). El 2026-09-18
          # salió 6000.6.2f1 y la línea 6000.6 pasó a apuntar ahí, así que el
          # 09-20 `unity install 6000.6.0f1` murió con «Provided editor version
          # does not match to any known Unity Editor versions» (exit 6) a los
          # 0,5 s, ANTES de descargar nada. No era el CLI —falla igual con
          # 1.0.0-beta.9 y con beta.10—: era el catálogo moviéndose bajo un pin
          # que no se mueve. Con el changeset la versión exacta SÍ resuelve
          # (probado en Linux, 3,88 GB), porque es la vía que el CLI tiene para
          # instalaciones que ya no están en el catálogo. Y no hay que
          # inventarlo: lo fija el propio proyecto.
          REVISION="$(sed -n 's/^m_EditorVersionWithRevision:.*(\([^)]*\)).*$/\1/p' \
            "$P" | tr -d '\r' | head -n 1)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "Unity del proyecto: $VERSION (changeset ${REVISION:-AUSENTE})"

      # El instalador del editor guarda los archivos comprimidos: una caché aquí
      # ahorra la descarga entera en cada push.
      # v5 es el mismo caché con el runtime nuevo (Node 24): el único cambio del
      # salto es la versión de Node. Se sube aquí también porque este job, hoy
      # saltado por `UNITY_CI`, es el único que quedaría emitiendo el aviso de
      # Node 20 el día que se active.
      #
      # ESTE es el paso que el disparador manual existe para poder ejercitar
      # (`unity: cache`) sin encender `UNITY_CI`, y es el MISMO `uses:` con el
      # MISMO `path`. La única diferencia en ese modo es la CLAVE: una de sonda.
      # Guardar la caché real cuando el directorio está vacío (ningún editor
      # descargado todavía) la dejaría ocupada — el servicio no permite
      # sobrescribir una clave existente — y el siguiente run completo
      # restauraría «con éxito» una caché sin nada dentro. La sonda ejercita el
      # runtime, el `with:` y la API round-trip sin tocar la clave de verdad.
      - name: Preparar el directorio de descargas (alcance cache)
        if: env.UNITY_SCOPE != 'full'
        run: mkdir -p ~/.config/unityhub/downloads

      - name: Restaurar la caché de descargas del editor
        uses: actions/cache@v5
        with:
          path: ~/.config/unityhub/downloads
          # La clave: `unity-downloads-<versión del proyecto>` y, solo en
          # alcance `cache`, el sufijo de sonda. El sufijo se elige con
          # `cond && 'x' || ''` y no con `cond && '' || 'x'`: en expresiones de
          # Actions `''` es FALSO, así que la forma invertida devolvería el
          # sufijo justo cuando la condición es cierta.
          key: unity-downloads-${{ steps.unity-version.outputs.version }}${{ env.UNITY_SCOPE != 'full' && '-sonda' || '' }}

      - name: Instalar la versión de Unity fijada por el proyecto
        if: env.UNITY_SCOPE == 'full' && env.UNITY_SELF_HOSTED != 'true'
        run: |
          # Del output del paso de versión: ProjectVersion.txt se lee UNA vez en
          # el job y los tres consumidores (clave del caché, este y el
          # localizador del editor) usan el mismo valor.
          VERSION="${{ steps.unity-version.outputs.version }}"
          REVISION="${{ steps.unity-version.outputs.revision }}"
          if [[ -n "$REVISION" ]]; then
            # El changeset es lo que permite instalar una versión que YA NO es
            # la del catálogo curado (el porqué, medido, en el paso de versión).
            # Sin él este paso falla en cuanto Unity publica una revisión de la
            # misma línea: el pin del proyecto no se mueve, el catálogo sí.
            echo "Instalando Unity $VERSION (changeset $REVISION)"
            unity install "$VERSION" --changeset "$REVISION" --yes --accept-eula
          else
            echo "::warning::ProjectVersion.txt no trae m_EditorVersionWithRevision: se instala $VERSION sin changeset, que solo resolverá si el catálogo curado aún ofrece esa versión"
            unity install "$VERSION" --yes --accept-eula
          fi

      # El editor es una aplicación de escritorio incluso en batch: sin estas
      # librerías sale antes de imprimir nada útil y el análisis del log daría
      # un veredicto vacío. Nombres de Ubuntu 24.04 (noble), que es lo que
      # corresponde a `runs-on: ubuntu-latest`.
      - name: Instalar las librerías de runtime del editor
        if: env.UNITY_SCOPE == 'full' && env.UNITY_SELF_HOSTED != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglu1-mesa libgtk-3-0t64 libnss3 \
            libasound2t64 libgbm1 libdrm2 libxtst6 \
            libxrandr2 libxcursor1 libxcomposite1 libxdamage1 \
            libxfixes3 libxi6 libxrender1 libxext6 \
            libsm6 libice6 libxkbcommon0 libpango-1.0-0 \
            libpangocairo-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 libatk1.0-0t64 \
            libatk-bridge2.0-0t64 libcups2t64 libdbus-1-3 libnotify4 \
            libsecret-1-0

      - name: Activar la licencia
        if: env.UNITY_SCOPE == 'full' && env.UNITY_SELF_HOSTED != 'true'
        env:
          UNITY_LICENSE_SERIAL: ${{ secrets.UNITY_LICENSE_SERIAL }}
          UNITY_LICENSE_FILE_BASE64: ${{ secrets.UNITY_LICENSE_FILE_BASE64 }}
        run: |
          if [[ -n "${UNITY_LICENSE_SERIAL:-}" ]]; then
            unity license activate --serial "$UNITY_LICENSE_SERIAL"
          else
            # base64 → archivo, en $RUNNER_TEMP: nunca queda en el workspace (y
            # el paso de máscara no hace falta para él porque jamás se imprime).
            printf '%s' "$UNITY_LICENSE_FILE_BASE64" | base64 -d > "$RUNNER_TEMP/unity-license.ulf"
            unity license activate --file "$RUNNER_TEMP/unity-license.ulf"
          fi
          unity license list

      # Falla en segundos si la máquina no puede terminar el trabajo (sin
      # licencia activable, editor ausente, disco corto, servicios inalcanzables)
      # en vez de a mitad de la compilación.
      - name: Preflight
        if: env.UNITY_SCOPE == 'full' && env.UNITY_SELF_HOSTED != 'true'
        run: unity doctor --ci

      - name: Localizar el editor instalado
        if: env.UNITY_SCOPE == 'full' && env.UNITY_SELF_HOSTED != 'true'
        run: |
          VERSION="${{ steps.unity-version.outputs.version }}"
          BASE="$(unity --quiet install-path | tail -n 1)"
          EDITOR="$BASE/$VERSION/Editor/Unity"
          if [[ ! -x "$EDITOR" ]]; then
            echo "::error::el editor no está en $EDITOR (base: $BASE)"
            ls -la "$BASE" || true
            exit 1
          fi
          echo "editor => $EDITOR"
          echo "UNITY_EDITOR_BIN=$EDITOR" >> "$GITHUB_ENV"

      - name: Compilar el proyecto Unity en batch (falla con cualquier error CS)
        if: env.UNITY_SCOPE == 'full'
        run: |
          if [[ "${UNITY_SELF_HOSTED}" == "true" ]]; then
            # Self-hosted: el editor lo resuelve el propio script en la
            # instalación del Hub de ESA máquina (el paso que publica
            # $UNITY_EDITOR_BIN es de los que no corren aquí).
            bash scripts/check-unity-compile.sh
          else
            bash scripts/check-unity-compile.sh --unity "$UNITY_EDITOR_BIN"
          fi

      # Devolver el asiento aunque el job falle o se cancele: en runners
      # efímeros, una activación filtrada por run acaba bloqueando la cuenta.
      # En alcance `cache` no se activó nada, así que no hay qué devolver.
      - name: Devolver la licencia
        if: always() && env.UNITY_SCOPE == 'full' && env.UNITY_SELF_HOSTED != 'true'
        run: unity license return --yes || true
